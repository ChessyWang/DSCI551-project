services:
  cassandra1:
    image: cassandra:4.1
    container_name: cassandra1
    hostname: cassandra1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_SEEDS=cassandra1,cassandra2
      - CASSANDRA_LISTEN_ADDRESS=cassandra1
      - CASSANDRA_BROADCAST_ADDRESS=cassandra1
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
    networks:
      - cassandra-net
    volumes:
      - cassandra1_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  cassandra2:
    image: cassandra:4.1
    container_name: cassandra2
    hostname: cassandra2
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_SEEDS=cassandra1,cassandra2
      - CASSANDRA_LISTEN_ADDRESS=cassandra2
      - CASSANDRA_BROADCAST_ADDRESS=cassandra2
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
    networks:
      - cassandra-net
    depends_on:
      cassandra1:
        condition: service_healthy
    volumes:
      - cassandra2_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  cassandra3:
    image: cassandra:4.1
    container_name: cassandra3
    hostname: cassandra3
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_SEEDS=cassandra1,cassandra2
      - CASSANDRA_LISTEN_ADDRESS=cassandra3
      - CASSANDRA_BROADCAST_ADDRESS=cassandra3
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
    networks:
      - cassandra-net
    depends_on:
      cassandra2:
        condition: service_healthy
    volumes:
      - cassandra3_data:/var/lib/cassandra

  app:
    image: python:3.11-slim
    container_name: cassandra-app
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: tail -f /dev/null
    depends_on:
      - cassandra1
    networks:
      - cassandra-net
    environment:
      - CASSANDRA_HOSTS=cassandra1,cassandra2,cassandra3

networks:
  cassandra-net:
    driver: bridge

volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data: